<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#a9dcf4" />
    <meta
      name="description"
      content="Нейродора: Кьют-рок против всех — однокнопочная аниме-игра про воздушные поцелуи."
    />
    <link rel="canonical" href="https://neurodora.com/game/" />
    <meta property="og:title" content="Нейродора · Кьют-рок против всех" />
    <meta property="og:description" content="Однокнопочная аниме-игра про воздушные поцелуи и силу кьют-рока." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://neurodora.com/game/" />
    <meta property="og:image" content="https://neurodora.com/game/assets/game-approved-v3/dora-maybe-pat-4.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Нейродора · Кьют-рок против всех</title>
    <link rel="stylesheet" href="cute-game.css?v=beta-0.1.12" />
  </head>
  <body>
    <main class="game-page">
      <section id="stage" class="stage" aria-label="Игра Нейродора: Кьют-рок против всех">
        <canvas
          id="gameCanvas"
          tabindex="0"
          aria-label="Нейродора выпускает воздушные поцелуи по приближающимся персонажам"
        ></canvas>

        <div id="hud" class="hud hidden" aria-live="polite">
          <div class="score"><small>СЧЁТ</small><b id="scoreValue">000000</b></div>
          <div id="lives" class="lives" aria-label="Три жизни"><i>♥</i><i>♥</i><i>♥</i></div>
        </div>

        <div id="enemyBar" class="enemy-bar hidden" aria-label="Здоровье противника">
          <b id="enemyName">НЕЙРОМИРОН</b>
          <i><span id="enemyBarFill"></span></i>
        </div>

        <div id="levelCard" class="level-card hidden" aria-live="polite">
          <strong id="levelTitle">НЕЙРОМИРОН</strong>
        </div>

        <section id="titleScreen" class="screen title-screen">
          <div class="title-clouds" aria-hidden="true">
            <i></i><i></i><i></i><i></i>
          </div>
          <div class="title-meadow" aria-hidden="true"></div>
          <div id="titleCast" class="title-cast" aria-hidden="true">
            <img
              class="title-cast-frame"
              src="assets/game-approved-v3/dora-maybe-pat-4.png"
              alt=""
            />
          </div>
          <div class="title-copy">
            <p class="beta-tag">v0.1 beta</p>
            <h1 aria-label="Кьют-рок против всех">
              <span class="title-logo-main">КЬЮТ-РОК</span>
              <span class="title-logo-vs">ПРОТИВ</span>
              <span class="title-logo-all">ВСЕХ</span>
            </h1>
            <button id="startButton" class="main-button start-button" type="button">
              <span>ИГРАТЬ</span><b>♥</b>
            </button>
          </div>
          <nav class="title-links" aria-label="Ссылки Нейродоры">
            <a href="https://neurodora.com/" target="_blank" rel="noopener noreferrer">
              ОСНОВНОЙ САЙТ <b>↗</b>
            </a>
            <a href="https://t.me/neurodora" target="_blank" rel="noopener noreferrer">
              TELEGRAM <b>↗</b>
            </a>
          </nav>
        </section>

        <section id="novelOverlay" class="novel-overlay hidden" aria-live="polite">
          <div class="novel-shade"></div>
          <img id="novelLeft" class="novel-person left hidden" alt="" />
          <img id="novelRight" class="novel-person right hidden" alt="" />
          <button id="novelNext" class="novel-box" type="button">
            <b id="novelSpeaker">РАССКАЗЧИК</b>
            <span id="novelText">Кьют-рок против всех.</span>
            <small>SPACE / КЛИК <i>▼</i></small>
          </button>
        </section>

        <section id="resultScreen" class="screen result-screen hidden" aria-live="polite">
          <div class="result-clouds" aria-hidden="true"><i></i><i></i><i></i></div>
          <div class="result-meadow" aria-hidden="true"></div>
          <div class="result-decor" aria-hidden="true"><i>♥</i><i>✦</i><i>♥</i><i>✦</i></div>
          <img
            id="resultCast"
            class="screen-cast result-cast"
            src="assets/game-approved-v3/dora-maybe-pat-4.png"
            alt=""
            aria-hidden="true"
          />
          <div class="result-copy">
            <p id="resultKicker">РЕЗУЛЬТАТ</p>
            <h2 id="resultTitle">ПОБЕДА</h2>
            <p id="resultText">КЬЮТ-РОК ПРОТИВ ВСЕХ — ПРОЙДЕНО.</p>
            <div class="result-score"><small>СЧЁТ</small><b id="finalScore">0</b></div>
            <a
              id="resultTelegram"
              class="telegram-button"
              href="https://t.me/neurodora"
              target="_blank"
              rel="noopener noreferrer"
            >ПОДПИСАТЬСЯ В TELEGRAM <b>↗</b></a>
            <button id="restartButton" class="main-button" type="button">ЗАНОВО <b>♥</b></button>
          </div>
        </section>

        <button id="soundButton" class="sound-button" type="button" aria-label="Выключить звук">♪</button>
        <audio
          id="backgroundMusic"
          src="assets/audio/kute-rock-instrumental.m4a"
          preload="metadata"
          loop
        ></audio>
      </section>
    </main>

    <script src="cute-game.js?v=beta-0.1.12"></script>
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"ce1213c7e62e4829ac111b234aa64707"}'></script>
  </body>
</html>
