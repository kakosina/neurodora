name: Apply serious footer and legal pages

on:
  push:
    branches: [main]
    paths:
      - neurodora-serious-footer-20260827.tgz
      - .github/workflows/apply-serious-footer-20260827.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify and apply update
        run: |
          echo "ce9c2c5d1dc46ad4bdb4924aceaed25fa4ab7f2eace96903b7be66723d304781  neurodora-serious-footer-20260827.tgz" | sha256sum --check --status
          tar -xzf neurodora-serious-footer-20260827.tgz
          test -f privacy/index.html
          test -f terms/index.html
          test -f legal-footer.css
          ! grep -R -E "ВСЕ 30 СТАТЕЙ|30 СТАТЕЙ|30 статей" index.html articles privacy terms
          rm neurodora-serious-footer-20260827.tgz
          rm .github/workflows/apply-serious-footer-20260827.yml

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish article library and add legal footer"
          git push
