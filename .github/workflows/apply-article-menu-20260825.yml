name: Apply unified article navigation

on:
  push:
    paths:
      - neurodora-article-menu-20260825.tgz
      - .github/workflows/apply-article-menu-20260825.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'kakosina'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply article navigation
        shell: bash
        run: |
          set -euo pipefail
          echo "3dff348624398abcf5977ef8c017ed3d88f154cb2784849ba90977a5c9ecfb37  neurodora-article-menu-20260825.tgz" | sha256sum --check
          tar -xzf neurodora-article-menu-20260825.tgz

          test "$(grep -l 'class="site-header"' articles/*/index.html | wc -l | tr -d ' ')" = "30"
          ! grep -E 'article-sitebar|article-sitebrand|КЬЮТ-РОКОЛОГИЯ</a>|>ИГРА</a>|ТЕЛЕГРАМ ↗' articles/*/index.html
          grep -q '<a href="/#about">СМОТРЕТЬ</a>' articles/intervyu-neirodora/index.html
          grep -q '<a href="/#now">СЛУШАТЬ</a>' articles/intervyu-neirodora/index.html
          grep -q '<a class="active" href="/articles/">ЧИТАТЬ</a>' articles/intervyu-neirodora/index.html
          grep -q 'article-shell.css?v=4' articles/intervyu-neirodora/index.html

          rm neurodora-article-menu-20260825.tgz
          rm .github/workflows/apply-article-menu-20260825.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify navigation across all articles"
          git push
