name: Apply OSS readiness package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the current main branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply and validate the documentation package
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode > /tmp/neurodora-oss-readiness.tgz <<'PAYLOAD'
          
          PAYLOAD
          tar -xzf /tmp/neurodora-oss-readiness.tgz -C .
          make check
          rm -f .github/workflows/apply-oss-readiness.yml

      - name: Commit the validated repository structure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Establish OSS project documentation and governance'
          git pull --rebase origin main
          git push origin HEAD:main
