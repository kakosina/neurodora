name: Apply Neurodora article fix

on:
  push:
    branches:
      - main
    paths:
      - neurodora-articles-fix.tgz
      - .github/workflows/apply-article-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-neurodora-article-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'kakosina/neurodora' && github.actor == 'kakosina'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the current site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the verified article update
        shell: bash
        run: |
          set -euo pipefail
          test -f neurodora-articles-fix.tgz
          echo "755d17113c3cc1472bd2a06faf2e81e36c8a2ef5571ea26148b70d2686f3889e  neurodora-articles-fix.tgz" | sha256sum -c -
          tar -xzf neurodora-articles-fix.tgz
          rm neurodora-articles-fix.tgz
          rm .github/workflows/apply-article-fix.yml
          test "$(grep -o 'class="article-photo-card"' articles/index.html | wc -l | tr -d ' ')" = "30"
          ! grep -R -E -i 'CUTE ROCK INSTITUTE|NEURODORA\.COMM|Фальшивая ретроспектива|полностью вымышлен|в документе|30 документов' articles --include='*.html'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix article presentation and copy"
          git push origin HEAD:main
