name: Apply navigation and article gallery update

on:
  push:
    paths:
      - neurodora-nav-articles-20260825.tgz
      - .github/workflows/apply-nav-articles-20260825.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'kakosina'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply site files
        shell: bash
        run: |
          set -euo pipefail
          echo "a67d13530588a2b62032ce0b6fb5c905832776136b6a3a1f793cf0898a72f9fd  neurodora-nav-articles-20260825.tgz" | sha256sum --check
          tar -xzf neurodora-nav-articles-20260825.tgz

          test "$(grep -o 'class="article-photo-card"' articles/index.html | wc -l | tr -d ' ')" = "30"
          test "$(find articles -mindepth 2 -maxdepth 2 -name index.html | wc -l | tr -d ' ')" = "30"
          ! grep -Eq '30 СТАТЕЙ · НИКАКОЙ|article-search|А ПОТОМ ИГРАТЬ|в полном|data-search' articles/index.html articles/library.js
          ! grep -E '<nav class="(cr-toc|crx-toc)"' articles/*/index.html
          grep -q '<a href="#about">СМОТРЕТЬ</a>' index.html
          grep -q '<a href="#now">СЛУШАТЬ</a>' index.html
          grep -q '<a href="/#about">СМОТРЕТЬ</a>' articles/index.html
          grep -q '<a href="/#now">СЛУШАТЬ</a>' articles/index.html

          rm neurodora-nav-articles-20260825.tgz
          rm .github/workflows/apply-nav-articles-20260825.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify navigation and article gallery"
          git push
