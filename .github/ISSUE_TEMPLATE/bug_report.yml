name: Bug report
description: Report a reproducible problem in the website, article library, game, or tooling.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include secrets, private media, or an exploitable security issue here; use the private contact in SECURITY.md instead.

  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Main website
        - Article library or article page
        - Browser game
        - Build or validation tooling
        - Documentation or repository automation
        - Other
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL or file
      description: Provide the exact public URL or repository path.
      placeholder: https://neurodora.com/game/
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include the visible result and any console error.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Device, operating system, browser, and browser version.
      placeholder: iPhone 15, iOS 19, Safari
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or additional context
      description: Remove personal data before attaching evidence.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I reproduced this on the current public site or latest main branch.
          required: true
        - label: This report does not disclose a security vulnerability or private information.
          required: true
