    <style id="monogatari-boot-style">
      #monogatari-boot { position: fixed; inset: 0; z-index: 2147483647; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; overflow: auto; padding: clamp(24px, 8vw, 100px); background: #efe9dc; color: #0b0b0c; font: 16px/1.6 Arial, sans-serif; }
      #monogatari-boot[hidden], #monogatari-boot [hidden] { display: none !important; }
      #monogatari-boot .boot-kicker { margin: 0 0 16px; color: #b60024; font-size: 14px; letter-spacing: .15em; }
      #monogatari-boot h1 { margin: 0 0 28px; font-size: clamp(30px, 7vw, 80px); line-height: 1; letter-spacing: -.04em; }
      #monogatari-boot h1 span { display: block; margin-top: 12px; font-size: .42em; letter-spacing: 0; font-weight: 400; }
      #monogatari-boot p { max-width: 640px; }
      #monogatari-boot .boot-help { font-size: 14px; color: #514d46; }
      #monogatari-boot .boot-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; }
      #monogatari-boot button { border: 1px solid #0b0b0c; border-radius: 0; padding: 12px 18px; background: #0b0b0c; color: #efe9dc; font: inherit; cursor: pointer; }
      #monogatari-boot button + button { background: transparent; color: #0b0b0c; }
      #monogatari-boot pre { max-width: 760px; margin: 20px 0 0; padding: 14px; border-left: 3px solid #b60024; font: 12px/1.5 monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
      #monogatari-boot .boot-version { margin-top: 32px; color: #726b61; font-size: 11px; letter-spacing: .08em; }
    </style>

    <section id="monogatari-boot" aria-label="時系列を読み込み中" aria-live="polite">
      <p class="boot-kicker">〈物語〉シリーズ</p>
      <h1>MONOGATARI<span>時系列</span></h1>
      <p id="monogatari-boot-status">時系列を開いています…</p>
      <p class="boot-help" id="monogatari-boot-help">添付ファイルのプレビューでこの表示が消えない場合は、HTMLファイルをダウンロードしてブラウザーで開いてください。</p>
      <noscript><p>このビューアーではJavaScriptが無効です。JavaScriptを有効にしたブラウザーでファイルを開いてください。</p></noscript>
      <div class="boot-actions" id="monogatari-boot-actions" hidden>
        <button id="monogatari-boot-retry" type="button">再試行</button>
        <button id="monogatari-boot-safe" type="button">アニメーションなしで開く</button>
      </div>
      <pre id="monogatari-boot-error" hidden></pre>
      <p class="boot-version">2026.10.18版 · 起動修正済み</p>
    </section>
    <script data-monogatari-boot>
      (function () {
        var panel = document.getElementById('monogatari-boot');
        var status = document.getElementById('monogatari-boot-status');
        var help = document.getElementById('monogatari-boot-help');
        var actions = document.getElementById('monogatari-boot-actions');
        var detail = document.getElementById('monogatari-boot-error');
        var failed = false;
        var timer;
        function fail(error) {
          failed = true;
          window.clearTimeout(timer);
          panel.hidden = false;
          status.textContent = "画面を起動できませんでした。";
          help.textContent = "アニメーションなしで開いてみてください。再度エラーが出る場合は、エラー文かこの画面のスクリーンショットを送ってください。";
          actions.hidden = false;
          detail.textContent = String(error && error.message ? error.message : error || "不明な起動エラー").slice(0, 700);
          detail.hidden = false;
        }
        window.__MONOGATARI_BOOT__ = {
          fail: fail,
          ready: function () {
            if (failed) return;
            window.clearTimeout(timer);
            panel.hidden = true;
          }
        };
        window.addEventListener('error', function (event) {
          var target = event.target;
          if (event.message) fail(event.error || event.message);
          else if (target && target.tagName === 'SCRIPT' && target.hasAttribute('data-monogatari-entry')) fail("時系列のプログラムを読み込めませんでした。");
          else if (target && target.tagName === 'LINK' && target.getAttribute('rel') === 'stylesheet') fail("時系列のスタイルを読み込めませんでした。");
        }, true);
        window.addEventListener('unhandledrejection', function (event) { fail(event.reason); });
        document.getElementById('monogatari-boot-retry').onclick = function () { window.location.reload(); };
        document.getElementById('monogatari-boot-safe').onclick = function () {
          try {
            var saved = JSON.parse(window.localStorage.getItem('monogatari-thread-v2') || '{}');
            if (!saved || typeof saved !== 'object' || Array.isArray(saved)) saved = {};
            saved.quiet = true;
            saved.entered = false;
            saved.route = '#/score?order=was';
            window.localStorage.setItem('monogatari-thread-v2', JSON.stringify(saved));
          } catch (error) { /* A restart also works when browser storage is unavailable. */ }
          try { window.history.replaceState(null, '', window.location.href.split('#')[0].split('?')[0] + '?motion=quiet'); }
          catch (error) { try { window.location.hash = ''; } catch (ignored) {} }
          window.location.reload();
        };
        timer = window.setTimeout(function () {
          status.textContent = "起動に通常より時間がかかっています。";
          actions.hidden = false;
        }, 12000);
      }());
    </script>
