  <body><a class="site-language game-language" data-language-link href="/game/" lang="ru" hreflang="ru" aria-label="Читать по-русски">RU</a>
    <main class="game-page">
      <section id="stage" class="stage" aria-label="Neurodora: Cute Rock vs. Everyone game">
        <canvas id="gameCanvas" tabindex="0" aria-label="Neurodora blows kisses at approaching characters"></canvas>

        <div id="hud" class="hud hidden" aria-live="polite">
          <div class="score"><small>SCORE</small><b id="scoreValue">000000</b></div>
          <div id="lives" class="lives" aria-label="Three lives"><i>♥</i><i>♥</i><i>♥</i></div>
        </div>

        <div id="enemyBar" class="enemy-bar hidden" aria-label="Opponent’s health">
          <b id="enemyName">NEUROMIRON</b>
          <i><span id="enemyBarFill"></span></i>
        </div>

        <div id="levelCard" class="level-card hidden" aria-live="polite">
          <strong id="levelTitle">NEUROMIRON</strong>
        </div>

        <section id="titleScreen" class="screen title-screen">
          <div class="title-clouds" aria-hidden="true">
            <i></i><i></i><i></i><i></i>
          </div>
          <div class="title-meadow" aria-hidden="true"></div>
          <div id="titleCast" class="title-cast" aria-hidden="true">
            <img class="title-cast-frame" src="/assets/game-approved-v3/dora-maybe-duel-title-v1.webp" alt="" />
          </div>
          <div class="title-copy">
            <p class="beta-tag">v0.1 beta</p>
            <h1 aria-label="Cute Rock vs. Everyone">
              <span class="title-logo-main">CUTE ROCK</span>
              <span class="title-logo-vs">VS.</span>
              <span class="title-logo-all">EVERYONE</span>
            </h1>
            <button id="startButton" class="main-button start-button" type="button">
              <span>PLAY</span><b>♥</b>
            </button>
            <nav class="title-links" aria-label="Neurodora’s links">
              <a href="/en/" target="_blank" rel="noopener noreferrer">
                MAIN SITE <b>↗</b>
              </a>
              <a href="https://t.me/neurodora" target="_blank" rel="noopener noreferrer">
                TELEGRAM <b>↗</b>
              </a>
            </nav>
          </div>
        </section>

        <section id="novelOverlay" class="novel-overlay hidden" aria-live="polite">
          <div class="novel-shade"></div>
          <img id="novelLeft" class="novel-person left hidden" alt="" />
          <img id="novelRight" class="novel-person right hidden" alt="" />
          <button id="novelNext" class="novel-box" type="button">
            <b id="novelSpeaker">NEURODORA</b>
            <span id="novelText">Cute Rock vs. Everyone.</span>
            <small>SPACE / CLICK <i>▼</i></small>
          </button>
        </section>

        <section id="resultScreen" class="screen result-screen hidden" aria-live="polite">
          <div class="result-clouds" aria-hidden="true"><i></i><i></i><i></i></div>
          <div class="result-meadow" aria-hidden="true"></div>
          <div class="result-decor" aria-hidden="true"><i>♥</i><i>✦</i><i>♥</i><i>✦</i></div>
          <img id="resultCast" class="screen-cast result-cast" src="/assets/game-approved-v3/dora-maybe-pat-4.webp" alt="" aria-hidden="true" />
          <div class="result-copy">
            <p id="resultKicker">CUTE ROCK VS. EVERYONE</p>
            <h2 id="resultTitle">VICTORY</h2>
            <p id="resultText">GAME COMPLETE.</p>
            <div class="result-score"><small>SCORE</small><b id="finalScore">0</b></div>
            <div class="result-actions">
              <a id="resultTelegram" class="telegram-button" href="https://t.me/neurodora" target="_blank" rel="noopener noreferrer">TELEGRAM <b>↗</b></a>
              <button id="restartButton" class="main-button" type="button">BACK TO HOME</button>
            </div>
          </div>
        </section>

        <button id="soundButton" class="sound-button" type="button" aria-label="Mute sound">♪</button>
        <audio id="backgroundMusic" src="/assets/audio/kute-rock-instrumental.m4a" preload="auto" loop></audio>
      </section>
    </main>
